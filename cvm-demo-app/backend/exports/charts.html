<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  :root {
    --navy: #0b1f3a;
    --gray: #4a5568;
    --teal: #0e8f9a;
    --offwhite: #f5f7fa;
    --charcoal: #2b2b2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #fff;
  }
  .chart-container {
    width: 900px;
    padding: 28px 32px 20px;
    background: #fff;
  }
  .chart-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  /* Gauge */
  .gauge-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
  }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script id="chart-data-script">/* DATA_PLACEHOLDER */</script>
</head>
<body>

<div id="braskem_revenue_cogs" class="chart-container"></div>
<div id="braskem_margin_bridge" class="chart-container"></div>
<div id="braskem_distress_gauge" class="chart-container" style="width:500px;"></div>
<div id="vale_revenue_cogs" class="chart-container"></div>
<div id="vale_margin_bridge" class="chart-container"></div>
<div id="vale_distress_gauge" class="chart-container" style="width:500px;"></div>

<script type="text/babel">
const {
  ResponsiveContainer, ComposedChart, BarChart, Bar, Cell,
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ReferenceLine, Area, Customized
} = Recharts;

const FINANCIAL_BLUE = '#2E86C1';
const FINANCIAL_BLUE_70 = 'rgba(46,134,193,0.70)';
const COST_RED = 'rgba(192,57,43,0.65)';
const NAVY = '#0b1f3a';
const BLUE_TOTAL = '#2E86C1';
const BLUE_POS = 'rgba(46,134,193,0.70)';

const LEVEL_COLOR = {
  'Healthy': '#0e8f9a',
  'Stable': '#0e8f9a',
  'Watchlist': '#EF9F27',
  'High Risk': '#E24B4A',
  'Distress': '#E24B4A',
  'Severe Distress': '#991b1b',
};

const tickStyle = { fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", fill: '#2b2b2b' };

// ── Revenue vs COGS ──────────────────────────────────────────────────────

function RevenueCOGSChart({ data, company }) {
  const fmtB = (v) => v != null ? `${(v / 1000000).toFixed(1)}B` : '—';

  const chartData = data.filter(r => r.revenue_abs != null).map(r => ({
    period: (r.period || '').slice(0, 4),
    revenue: r.revenue_abs / 1000000,
    cogs: Math.abs(r.cogs_abs || 0) / 1000000,
  }));

  // deduplicate by year (keep last)
  const seen = {};
  chartData.forEach(r => { seen[r.period] = r; });
  const unique = Object.values(seen);

  return (
    <div>
      <div className="chart-title">{company} — Revenue vs COGS (BRL B)</div>
      <ResponsiveContainer width="100%" height={380}>
        <ComposedChart data={unique} margin={{ top: 20, right: 30, left: 10, bottom: 10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(11,31,58,0.06)" />
          <XAxis dataKey="period" tick={tickStyle} />
          <YAxis tick={tickStyle} unit=" B" />
          <Tooltip formatter={(v) => `${v?.toFixed(1)} B`} />
          <Legend wrapperStyle={{ fontSize: 13, fontFamily: "'IBM Plex Sans', sans-serif" }} />
          <Area type="monotone" dataKey="cogs" fill={FINANCIAL_BLUE} fillOpacity={0.06} stroke="none" />
          <Line type="monotone" dataKey="revenue" name="Revenue" stroke={FINANCIAL_BLUE}
                strokeWidth={2.5} dot={{ r: 5, fill: FINANCIAL_BLUE, stroke: '#fff', strokeWidth: 2 }}
                label={({ x, y, value }) => (
                  <text x={x} y={y - 14} textAnchor="middle" fontSize={11} fontWeight="700"
                        fontFamily="'IBM Plex Mono', monospace" fill={FINANCIAL_BLUE}>
                    {value?.toFixed(1)}B
                  </text>
                )}
          />
          <Line type="monotone" dataKey="cogs" name="COGS" stroke={COST_RED}
                strokeWidth={2.5} strokeDasharray="6 3"
                dot={{ r: 5, fill: 'rgba(192,57,43,0.65)', stroke: '#fff', strokeWidth: 2 }}
                label={({ x, y, value }) => (
                  <text x={x} y={y + 22} textAnchor="middle" fontSize={11} fontWeight="700"
                        fontFamily="'IBM Plex Mono', monospace" fill="rgba(192,57,43,0.65)">
                    {value?.toFixed(1)}B
                  </text>
                )}
          />
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── Waterfall / Margin Bridge ────────────────────────────────────────────

function prepareWaterfall(bridge) {
  const items = [
    { name: bridge.start_label.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
      value: bridge.start_value, type: 'total' },
    ...bridge.factors.map(f => ({
      name: f.name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
      value: f.value, type: 'change',
    })),
    { name: bridge.end_label.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
      value: bridge.end_value, type: 'total' },
  ];

  let running = 0;
  return items.map(item => {
    const isTotal = item.type === 'total';
    const isNegative = item.value < 0;
    let base, barVal;

    if (isTotal) {
      base = item.value < 0 ? item.value : 0;
      barVal = Math.abs(item.value);
      running = item.value;
    } else {
      if (isNegative) {
        base = running + item.value;
      } else {
        base = running;
      }
      barVal = Math.abs(item.value);
      running += item.value;
    }

    return {
      name: item.name,
      base,
      barVal,
      isTotal,
      isNegative,
      originalValue: item.value,
      runningAfter: isTotal ? item.value : running,
    };
  });
}

function ConnectorLines({ xAxisMap, yAxisMap, chartData }) {
  try {
    const xAxis = Object.values(xAxisMap || {})[0];
    const yAxis = Object.values(yAxisMap || {})[0];
    if (!xAxis?.scale || !yAxis?.scale) return null;
    const xScale = xAxis.scale;
    const yScale = yAxis.scale;
    const bw = xScale.bandwidth ? xScale.bandwidth() : 40;

    return (
      <g>
        {chartData.map((d, i) => {
          if (i >= chartData.length - 1) return null;
          const next = chartData[i + 1];
          const x1 = xScale(d.name) + bw;
          const x2 = xScale(next.name);
          const y = yScale(d.runningAfter);
          if (x1 == null || x2 == null || isNaN(y)) return null;
          return (
            <line key={i} x1={x1} y1={y} x2={x2} y2={y}
                  stroke="rgba(11,31,58,0.22)" strokeWidth={1} strokeDasharray="4 3" />
          );
        })}
      </g>
    );
  } catch { return null; }
}

function MarginBridgeChart({ bridge, company }) {
  const chartData = React.useMemo(() => prepareWaterfall(bridge), [bridge]);

  const allLevels = chartData.flatMap(d => [d.base, d.base + d.barVal, 0]);
  const rawMin = Math.min(...allLevels);
  const rawMax = Math.max(...allLevels);
  const pad = (rawMax - rawMin) * 0.22 || 1;

  const BarLabel = React.useCallback(({ x, y, width, height, index }) => {
    const d = chartData[index];
    if (!d || width < 12) return null;
    const labelY = d.originalValue < 0 ? y + height + 16 : y - 8;
    const color = d.isTotal ? BLUE_TOTAL : d.isNegative ? COST_RED : BLUE_POS;
    const absStr = Math.abs(d.originalValue).toFixed(1);
    const sign = d.isTotal ? (d.originalValue < 0 ? '−' : '') : (d.isNegative ? '−' : '+');
    return (
      <text x={x + width / 2} y={labelY} fill={color} fontSize={13}
            fontFamily="'IBM Plex Mono', monospace" fontWeight="700" textAnchor="middle">
        {`${sign}${absStr}%`}
      </text>
    );
  }, [chartData]);

  const Connector = React.useCallback(
    (props) => <ConnectorLines {...props} chartData={chartData} />,
    [chartData]
  );

  return (
    <div>
      <div className="chart-title">{company} — Margin Bridge: Peak → Current</div>
      <ResponsiveContainer width="100%" height={380}>
        <BarChart data={chartData} margin={{ top: 28, right: 20, left: 10, bottom: 10 }} barCategoryGap="28%">
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(11,31,58,0.06)" vertical={false} />
          <XAxis dataKey="name"
                 tick={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", fill: '#2b2b2b' }}
                 tickLine={false} />
          <YAxis domain={[rawMin - pad, rawMax + pad]}
                 tickFormatter={(v) => `${v.toFixed(0)}`}
                 tick={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}
                 tickLine={false} axisLine={false} unit="%" />
          <ReferenceLine y={0} stroke="rgba(11,31,58,0.25)" strokeWidth={1} />
          <Bar dataKey="base" stackId="wf" fill="transparent" isAnimationActive={false} />
          <Bar dataKey="barVal" stackId="wf" isAnimationActive={false} label={BarLabel} radius={[3, 3, 0, 0]}>
            {chartData.map((d, i) => (
              <Cell key={i} fill={d.isTotal ? BLUE_TOTAL : d.isNegative ? COST_RED : BLUE_POS} />
            ))}
          </Bar>
          <Customized component={Connector} />
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── Distress Gauge ───────────────────────────────────────────────────────

function DistressGauge({ score, level, company }) {
  const pct = Math.min(Math.max(score ?? 0, 0), 100) / 100;
  const color = LEVEL_COLOR[level] ?? 'rgba(11,31,58,0.3)';
  const cx = 150, cy = 155, R = 120;
  const arcPath = `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`;
  const theta = Math.PI * (1 - pct);
  const nx = cx + R * Math.cos(theta);
  const ny = cy - R * Math.sin(theta);

  return (
    <div>
      <div className="chart-title" style={{ textAlign: 'center' }}>{company} — Distress Score</div>
      <div className="gauge-wrapper">
        <svg width="300" height="175" viewBox="0 0 300 175">
          <defs>
            <linearGradient id={`grad_${company}`} x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor="#0e8f9a" />
              <stop offset="50%" stopColor="#EF9F27" />
              <stop offset="100%" stopColor="#E24B4A" />
            </linearGradient>
          </defs>
          <path d={arcPath} fill="none" stroke="rgba(11,31,58,0.08)" strokeWidth={22} strokeLinecap="round" />
          <path d={arcPath} fill="none" stroke={`url(#grad_${company})`} strokeWidth={16} strokeLinecap="round" opacity={0.9} />
          <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="rgba(11,31,58,0.25)" strokeWidth={2.5} strokeLinecap="round" />
          <circle cx={cx} cy={cy} r={6} fill="rgba(11,31,58,0.25)" />
          <circle cx={cx} cy={cy} r={3} fill="#f5f7fa" />
          <text x={cx} y={cy - 28} textAnchor="middle" fontSize="34" fontWeight="700" fill={color}
                fontFamily="'IBM Plex Sans', sans-serif">
            {Math.round(score ?? 0)}
          </text>
          <text x={cx} y={cy - 6} textAnchor="middle" fontSize="15" fontWeight="600" fill="#4a5568"
                fontFamily="'IBM Plex Sans', sans-serif">
            {level}
          </text>
          <text x={cx - R - 4} y={cy + 18} textAnchor="middle" fontSize="11" fill="#94a3b8"
                fontFamily="'IBM Plex Mono', monospace">0</text>
          <text x={cx + R + 4} y={cy + 18} textAnchor="middle" fontSize="11" fill="#94a3b8"
                fontFamily="'IBM Plex Mono', monospace">100</text>
          <text x={cx} y={cy - R - 10} textAnchor="middle" fontSize="11" fill="#94a3b8"
                fontFamily="'IBM Plex Mono', monospace">50</text>
        </svg>
      </div>
    </div>
  );
}

// ── Render ────────────────────────────────────────────────────────────────

const CHART_DATA = window.__CHART_DATA__;
(() => {
  const data = CHART_DATA;
  const { braskem, vale } = data;

  ReactDOM.createRoot(document.getElementById('braskem_revenue_cogs')).render(
    <RevenueCOGSChart data={braskem.time_series} company="Braskem" />
  );
  ReactDOM.createRoot(document.getElementById('braskem_margin_bridge')).render(
    <MarginBridgeChart bridge={braskem.margin_bridge} company="Braskem" />
  );
  ReactDOM.createRoot(document.getElementById('braskem_distress_gauge')).render(
    <DistressGauge score={braskem.distress?.distress_score ?? braskem.risk_score}
                   level={braskem.distress?.band ?? braskem.risk_level} company="Braskem" />
  );

  ReactDOM.createRoot(document.getElementById('vale_revenue_cogs')).render(
    <RevenueCOGSChart data={vale.time_series} company="Vale" />
  );
  ReactDOM.createRoot(document.getElementById('vale_margin_bridge')).render(
    <MarginBridgeChart bridge={vale.margin_bridge} company="Vale" />
  );
  ReactDOM.createRoot(document.getElementById('vale_distress_gauge')).render(
    <DistressGauge score={vale.distress?.distress_score ?? vale.risk_score}
                   level={vale.distress?.band ?? vale.risk_level} company="Vale" />
  );

  // Signal readiness after a render tick
  setTimeout(() => {
    document.title = 'CHARTS_READY';
  }, 1500);
})();
</script>
</body>
</html>
